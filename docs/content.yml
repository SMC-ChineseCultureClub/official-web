  closing: TODO # 保持现有这段我觉得挺好的


# ───────────────────────────────────────────────────────────────────────
# 4. Events（活动）
#    ⚠️ 这是全站风险最高的部分：现在有 5 条编造的未来活动，带具体日期。
#    学生按假日期跑来是实际伤害，不是「内容不新」而已。
#
#    条数随意。只有 2 场确认的就只写 2 条，我会把布局改成自适应。
# ───────────────────────────────────────────────────────────────────────
events:
  # 顶部那张大卡（主打活动）。不需要就整块写 feature: REMOVE
  feature:
    tag: TODO                 # 例: Headline event · February
    title: TODO               # 例: Lunar New Year Gala & Banquet
    title_cn: TODO            # 例: 农历新年 · 春节晚会
    description: TODO
    date: TODO                # 例: "Sat · 14 Feb"
    time: TODO                # 例: "6 — 10 PM"
    location: TODO            # 例: Cafeteria
    location_note: TODO       # 例: SMC Campus
    cost: TODO                # 例: "Free · RSVP"
    cost_note: TODO           # 例: Members + guests
    photo: TODO               # 照片文件名，放 public/ 下；没有就写 REMOVE
    seal_cn: TODO             # 卡片角上的印章字，1 个汉字，例: 春

  # 下方列表。每条一个 - 开头。增删随意。
  list:
    - day: TODO               # 例: 28
      month: TODO             # 例: September
      title: TODO             # 例: Mid-Autumn Mooncake Night
      title_cn: TODO          # 例: 中秋赏月
      where: TODO
      when: TODO              # 例: "7:30 — 10:00 PM"

    - day: TODO
      month: TODO
      title: TODO
      title_cn: TODO
      where: TODO
      when: TODO

  # 如果活动条数不够，是否在列表末尾加一条引导关注 Instagram 的入口
  show_instagram_cta: TODO    # true 或 false


