# ═══════════════════════════════════════════════════════════════════════
#  CCC @ SMC — 网站内容填写表
# ═══════════════════════════════════════════════════════════════════════
#
#  怎么用：
#    1. 把下面每个 TODO 换成真实内容。
#    2. 拿不准 / 还没确认的，**保持 TODO 不要动**——我不会去猜，
#       会原样跳过那一项并在报告里列出来。
#    3. 确定不要某一项（例如整块删掉），把值写成 REMOVE。
#    4. 填完告诉我，我读这份文件写进代码。
#
#  几条注意：
#    - 中文引号「」『』和标点都可以直接写，不用转义。
#    - 值里含有 : # 等符号时，用双引号包起来，例如 "11:15 AM"
#    - events / gallery / officers 三个列表**条数随意增删**，
#      代码结构我来适配，不用管现在是几条。
#    - 行首的 - 号表示一条记录，缩进请对齐。
#
# ═══════════════════════════════════════════════════════════════════════


# ───────────────────────────────────────────────────────────────────────
# 1. 全站公用值
#    ⚠️ 这几个值在代码里出现在多个地方（成立年份有 4 处），
#    以前就是因为分散所以互相矛盾。这里填一次，我同步到所有位置。
# ───────────────────────────────────────────────────────────────────────
site:
  # 社团成立年份。出现在：Hero 副标题、About 数据块、Nav 品牌行、Footer 版权
  # 现在站内写的是 2025，但 Gallery 里有 2023 的活动，自相矛盾
  founded_year: 2025          # 例: 2025

  # Footer 版权年份（通常是今年）
  copyright_year: 2026        # 例: 2026

  # 当前 board 的届别，显示为「The 2026 board.」
  board_year: 2026            # 例: 2026

  # 固定会议地点。出现在：Hero 三格、About 数据块、Join 信息表
  # 现在 About/Join 写 HSS 151，但 Events 里出现过 HSS 152
  meeting_room: HSS 252          # 例: HSS 151
  meeting_building: Humanities & Social Science      # 例: Humanities & Social Science
  campus_address: 1900 Pico Boulevard, Santa Monica, CA        # 例: 1900 Pico Boulevard, Santa Monica, CA

  # 固定会议时间。出现在：Hero 三格、About 数据块（短版）、Join 信息表（长版）
  #
  # ⚠️ 会议是【每两周一次】。原表单漏了这个字段，导致全站文案一直在暗示 weekly
  #    （About 的标签原本写的就是「Weekly hour」）。
  #    英文 biweekly 有歧义（也可指一周两次），全站统一用 every other。
  meeting_frequency: every other week
  meeting_time_short: "Thu 11:15AM"
  meeting_time_long: "Every other Thursday · 11:15 AM — 12:30 PM"

  # 联系方式
  email: chineseculture.smc@gmail.com                 # 例: chineseculture.smc@gmail.com
  instagram_handle: smc.ccc_      # 例: smc.ccc_   （不要带 @ 和网址）
  smc_clubs_url: "https://www.smc.edu/community/office-of-student-life/student-government/clubs/chinese-culture-club.php"         # SMC 官网社团页，填前请点开确认还有效

  # 网站域名（影响 SEO metadata 和 public/CNAME）
  domain: TODO                # 例: ccc.peterguan.com

  # ⚠️ 现在全站被 robots noindex 屏蔽，不会被搜索引擎收录。
  # 准备好上线了就改成 true
  allow_search_indexing: false


# ───────────────────────────────────────────────────────────────────────
# 2. Hero（首屏）
# ───────────────────────────────────────────────────────────────────────
hero:
  # 首屏大段介绍（原「the slow art of Chinese culture — tea poured carefully…」）。
  # 2026-09-13 已从页面删除：放在那里不好看，右侧也是笔刷停靠的位置。
  # 原位置改为 tagline 右侧的「Follow us on Instagram →」按钮（链接 instagram_handle）。
  # 不再需要填写。
  lede: REMOVE

  # 中文小字副标题，现在是「a quieter way of belonging.」
  tagline_en: TODO
  # 这里我也希望你可以给我一些建议。

  # 首屏底部三格。最早的 240+ 会员 / 14 场活动 / II 年是编的，
  # 中间一版 10+ events a year / ALL backgrounds welcome 也已撤下。
  # 现在三格全是会议信息（时间 / 地点 / 频率），直接取自上面的 site.meeting_*——
  # 改会议时间或地点时，这里要一起改。
  stats:
    - value: "11:15 AM"
      label: until 12:30 PM
    - value: HSS 252
      label: where we meet
    - value: Thu
      label: every other week


# ───────────────────────────────────────────────────────────────────────
# 3. About（关于我们）
# ───────────────────────────────────────────────────────────────────────
about:
  # 2026-09-13 已写入 components/About.tsx。定位：第一印象是交朋友的 social club，
  # 文化学习留给 meeting。创始人真名不出现；也不提校内其它华人学生组织。
  # 访客不读大段文字 → 只保留：一句 lead + 四格活动 + 一句 closing。
  # 已删：竖排诗卡片（一盏茶，一段话…）和「会」印章、底部三格（与 Hero 重复）、长段落。
  heading: "Good company, and a little culture."   # 原「An unhurried home for heritage.」

  lead: "A place at SMC to make friends, with Chinese culture as the thread that ties it together."

  activities:
    - what: Calligraphy
      note: 福 characters, spring couplets
    - what: Crafts
      note: Plaster figurines, cloisonné      # 掐丝珐琅，已确认
    - what: Games
      note: Trivia on festivals and traditions   # 原 Kahoot
    - what: Potlucks
      note: And holiday events with other clubs

  closing: "No fluency, no prior knowledge, no Chinese surname required. Only curiosity, and a willingness to listen."

  # 成立背景（真实信息，暂未上页面，留作以后「Our story」之类的位置备用）：
  founding_story: >-
    Three students started the club in 2025. SMC already had clubs celebrating Korean,
    Japanese, Mexican, and Pacific Islander cultures, but nowhere to share Chinese culture —
    so they built one, open to everyone. Most of our members grew up with it, in China,
    Malaysia, Singapore, or Chinese American homes; the rest simply got curious, and after
    a meeting or two nobody is keeping track.


