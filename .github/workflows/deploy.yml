name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs these to hand the built site to the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # next.config.ts already sets output: 'export', so this writes ./out.
      # Deliberately no actions/configure-pages: its static_site_generator
      # injection only understands next.config.js/.mjs, and the apex custom
      # domain needs basePath to stay empty anyway.
      - run: npm run build

      # public/CNAME is copied into out/ by the export and is what actually
      # holds the custom domain — keep it in sync with the Pages setting.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
